# Rung: Stated, unconditional (StyleGuide/error)
# Source: claude-skills skills/doc-style-guide/SKILL.md:424-430 "Dates must be fully written"
#   ("When listing only a month and year, do not separate them with a comma").
extends: existence
message: "Do not put a comma between a month and year ('%s'). Write 'June 2021'."
link: https://github.com/htan13/doc-linter/blob/main/STYLE_GUIDE.md#dates-and-times
level: error
scope: text & ~frontmatter
nonword: true
tokens:
  - '\b(?:January|February|March|April|May|June|July|August|September|October|November|December),\s+\d{4}\b'
tests:
  - name: fires
    input: |
      The feature shipped in June, 2021.
    want: |
      1:24:StyleGuide.DateMonthYearComma:Do not put a comma between a month and year ('June, 2021'). Write 'June 2021'.
  - name: clean
    input: |
      The feature shipped in June 2021 and again on June 30, 2021.
    want: ""
