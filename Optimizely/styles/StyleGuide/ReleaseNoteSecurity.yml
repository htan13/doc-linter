# Rung: Stated, unconditional (StyleGuide/error)
# Source: claude-skills skills/doc-rn-review/SKILL.md:182 and :239 (check S1: a security note is exactly the literal
#   "Improved security." with no additional detail).
# Applies to release notes only (see templates/release-notes.vale.ini).
extends: existence
message: "A security release note is exactly 'Improved security.' with no other detail."
link: https://github.com/htan13/doc-linter/blob/main/STYLE_GUIDE.md#release-notes
level: error
scope: raw
nonword: true
tokens:
  - '(?m)\bImproved (?:the )?security\b(?!\.[ \t]*$)[^\n]*'
tests:
  - name: fires
    input: |
      - Improved security by patching CVE-2026-1234 in the login flow.
    want: |
      1:3:StyleGuide.ReleaseNoteSecurity:A security release note is exactly 'Improved security.' with no other detail.
  - name: clean
    input: |
      - Improved security.
    want: ""
