# Rung: Stated, unconditional (StyleGuide/error)
# Source: claude-skills skills/doc-style-guide/SKILL.md:527-529 "Lists must have at least two items".
# A script: it counts the sibling items of each list at the same indentation, ignoring
# fenced code and nested items.
extends: script
message: "This list has one item. Write it as a sentence, or add the missing items."
link: https://github.com/htan13/doc-linter/blob/main/STYLE_GUIDE.md#write-lists
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  fence := ""
  offset := 0
  count := 0
  first := -1
  firstEnd := -1
  indent := -1
  blank := false
  flush := func() {
    if count == 1 { matches = append(matches, {begin: first, end: firstEnd}) }
    count = 0
    indent = -1
    first = -1
  }
  for line in text.split(scope, "\n") {
    trimmed := text.trim_space(line)
    lead := len(line) - len(text.trim_left(line, " \t"))
    if fence != "" {
      if text.has_prefix(trimmed, fence) { fence = "" }
    } else if text.has_prefix(trimmed, "```") || text.has_prefix(trimmed, "~~~") {
      fence = text.substr(trimmed, 0, 3)
      if lead <= indent { flush() }
    } else if trimmed == "" {
      blank = true
    } else if text.re_match(`^\s*(?:[-*+]|\d+[.)])\s+\S`, line) {
      if indent == -1 {
        count = 1
        indent = lead
        first = offset + lead
        firstEnd = offset + len(line)
      } else if lead == indent {
        count += 1
      } else if lead < indent {
        flush()
        count = 1
        indent = lead
        first = offset + lead
        firstEnd = offset + len(line)
      }
      blank = false
    } else {
      if indent != -1 && (lead <= indent && (blank || !text.re_match(`^\s`, line))) {
        if blank || lead == 0 { flush() }
      }
      blank = false
    }
    offset += len(line) + 1
  }
  flush()
tests:
  - name: fires
    input: |
      Configure the following setting:

      - **Timeout** – Enter the timeout in seconds.

      Save the page.
    want: |
      3:1:StyleGuide.ListSingleItem:This list has one item. Write it as a sentence, or add the missing items.
  - name: clean
    input: |
      Configure the following settings:

      - **Timeout** – Enter the timeout in seconds.
        - Use 30 seconds for most sites.
      - **Retries** – Enter the number of retries.

      1. Open the page.
      2. Save the page.
    want: ""
