# Optional GitHub Actions workflow for a documentation repository. Copy it to
# .github/workflows/vale.yml to lint changed pages on every pull request.
name: Vale
on:
  pull_request:
    paths:
      - "docs/**"
      - ".vale.ini"
permissions:
  contents: read
  pull-requests: write
jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Optimizely Vale package
        # The package lives in htan13/doc-linter; .vale.ini names it in Packages.
        run: |
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v3.23.0/vale_3.23.0_Linux_64-bit.tar.gz" | tar -xz -C "$RUNNER_TEMP" vale
          "$RUNNER_TEMP/vale" sync
      - uses: errata-ai/vale-action@v2
        with:
          version: 3.23.0
          files: docs
          filter_mode: added
          fail_on_error: false
