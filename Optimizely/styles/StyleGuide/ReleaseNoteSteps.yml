# Rung: Stated, unconditional (StyleGuide/error)
# Source: claude-skills skills/doc-rn-review/SKILL.md:119 ("Do not include any step-by-step instructions in release notes.
#   Instead, they should link to relevant documentation") and check E6.
# Applies to release notes only (see templates/release-notes.vale.ini).
extends: existence
message: "Do not put step-by-step instructions in a release note. Link to the documentation instead."
link: https://github.com/htan13/doc-linter/blob/main/STYLE_GUIDE.md#release-notes
level: error
scope: raw
nonword: true
tokens:
  - '(?m)^[ \t]*1[.)][ \t]+\S[^\n]*\n(?:[^\n]*\n)*?[ \t]*2[.)][ \t]+\S'
tests:
  - name: fires
    input: |
      1. Open **Settings**.
      2. Click **Save**.
    want: |
      1:1:StyleGuide.ReleaseNoteSteps:Do not put step-by-step instructions in a release note. Link to the documentation instead.
  - name: clean
    input: |
      - Added a **Save** option to **Settings**. See [Configure settings](https://example.com).
    want: ""
