# Vale configuration for Optimizely release notes.
#
# The rules live in one place, https://github.com/htan13/doc-linter, and are published as the
# Optimizely Vale package. Do not copy rules into this repository; change them in doc-linter.
#
#   vale sync     # download the package into .vale/styles (run once, and in CI before linting)
#   vale docs     # lint the release notes
#
# Requires Vale 3.20.0 or later.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/htan13/doc-linter/releases/latest/download/Optimizely.zip

[*.{md,mdx}]
# Release-note rules from /doc-rn-review. The package turns them off for documentation.
StyleGuide.ReleaseNoteBeta = YES
StyleGuide.ReleaseNoteBoldLead = YES
StyleGuide.ReleaseNoteEnhancementLink = YES
StyleGuide.ReleaseNoteFixLink = YES
StyleGuide.ReleaseNoteFixOpener = YES
StyleGuide.ReleaseNoteFixWording = YES
StyleGuide.ReleaseNoteGA = YES
StyleGuide.ReleaseNotePeriod = YES
StyleGuide.ReleaseNoteScreenshots = YES
StyleGuide.ReleaseNoteSecurity = YES
StyleGuide.ReleaseNoteSteps = YES
StyleGuide.ReleaseNoteVerbLead = YES
