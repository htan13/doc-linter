extends: existence
message: "Observed convention (38 of 38 sampled pages): capitalize 'Visual Builder'."
level: suggestion
vocab: false
scope: text & ~frontmatter.slug & ~frontmatter.createdAt & ~frontmatter.docTags
ignorecase: false
tokens:
  - '(?:visual builder|Visual builder|visual Builder)'
tests:
