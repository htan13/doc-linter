    input: |
      Open the visual builder.
    want: |
      1:10:Observed.VisualBuilderCasing:Observed convention (38 of 38 sampled pages): capitalize 'Visual Builder'.
  - name: clean
    input: |
      Open Visual Builder.
    want: ""
