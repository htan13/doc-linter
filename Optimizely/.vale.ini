# Optimizely Vale package
#
# This file ships inside Optimizely.zip, the package that every Optimizely documentation
# repository installs with `vale sync`. Vale merges it under the repository's own .vale.ini,
# so a repository's settings win over the ones here.
#
# Source of the rules: STYLE_GUIDE.md and RULES.md in https://github.com/htan13/doc-linter.
# Requires Vale 3.20.0 or later (rule inheritance and the Std library).

MinAlertLevel = suggestion
Vocab = Optimizely

[*.{md,mdx}]
BasedOnStyles = StyleGuide, Observed, Voices, Direct, Moose, House

# Promptless baseline rules that the Optimizely style guide supersedes. Each dimension is
# governed by the StyleGuide rule named in the comment.
Direct.Hedging = NO   # superseded by StyleGuide.Hedging (doc-style-guide "Hedging language")
Direct.Length = NO    # superseded by StyleGuide.SentenceLength (doc-style-guide: fewer than 20 words)
Moose.EmDash = NO     # superseded by StyleGuide.Dashes (doc-style-guide allows em dashes for pauses)

# Release-note rules (doc-rn-review). Off for documentation; each *-release-notes
# repository turns them on in its own .vale.ini.
StyleGuide.ReleaseNoteBeta = NO
StyleGuide.ReleaseNoteBoldLead = NO
StyleGuide.ReleaseNoteEnhancementLink = NO
StyleGuide.ReleaseNoteFixLink = NO
StyleGuide.ReleaseNoteFixOpener = NO
StyleGuide.ReleaseNoteFixWording = NO
StyleGuide.ReleaseNoteGA = NO
StyleGuide.ReleaseNotePeriod = NO
StyleGuide.ReleaseNoteScreenshots = NO
StyleGuide.ReleaseNoteSecurity = NO
StyleGuide.ReleaseNoteSteps = NO
StyleGuide.ReleaseNoteVerbLead = NO


# Observed rules are collection-specific corpus conventions. Each repository turns on
# only the ones recorded for it. They are never promoted to StyleGuide here.
Observed.OptimizelyGraphCasing = NO
Observed.ProseBranding = NO
Observed.VisualBuilderCasing = NO
