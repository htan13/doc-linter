name: Test rules
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.23.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Vale
        run: |
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar -xz -C /usr/local/bin vale
          vale --version
      - name: Run the rule tests
        run: tests/run.sh
