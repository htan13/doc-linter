# Rung: Stated, unconditional (StyleGuide/error)
# Source: claude-skills skills/doc-style-guide/SKILL.md:533-538 "Code blocks must specify the language".
# A script, because an opening fence and a closing fence look the same.
extends: script
message: "Add a language identifier to this code block (for example, ```javascript)."
link: https://github.com/htan13/doc-linter/blob/main/STYLE_GUIDE.md#format-code
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  fence := ""
  offset := 0
  for line in text.split(scope, "\n") {
    trimmed := text.trim_space(line)
    if fence != "" {
      if text.has_prefix(trimmed, fence) && text.trim_space(text.trim_left(trimmed, "`~")) == "" { fence = "" }
    } else if text.re_match("^(```+|~~~+)", trimmed) {
      fence = text.re_find("^(```+|~~~+)", trimmed)[0][0].text
      info := text.trim_space(text.substr(trimmed, len(fence)))
      if info == "" {
        start := offset + len(line) - len(text.trim_left(line, " \t"))
        matches = append(matches, {begin: start, end: start + len(fence)})
      }
    }
    offset += len(line) + 1
  }
tests:
  - name: fires
    input: |
      Run the following command:

      ```
      npm install
      ```
    want: |
      3:1:StyleGuide.CodeBlockLanguage:Add a language identifier to this code block (for example, ```javascript).
  - name: clean
    input: |
      Run the following command:

      ```shell
      npm install
      ```
    want: ""
